 completeness, consistency and accuracy. Generic business-data quality is insufficient.", "intermediate_practice": "Curate and validate the actual discovery and reuse descriptions", "earliest_level_evidence": {"descriptor_id": "D4-L1", "phrase": "curator", "clause": "Key emerging roles: curator (e.g. corrects and complements data in systems, checks consistency, completeness, and accuracy); semantic expert (e.g. creates and corrects data dictionaries)", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L101"}, "activity_ids": ["ACT-10-002", "ACT-10-006"], "activities": ["Define Data Quality Requirements ((D)", "Test and Validate Data Quality Requirements (D)"], "deliverables": ["Data Quality Requirements Document", "Data Quality Test Cases"], "source_references": ["file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1850", "file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1854"], "source_fair_direct": [], "source_fair_indirect": ["F2", "R1"], "status": "proposed documentary judgement; not an assessed maturity level"}, {"id": "ONSET-11-direct", "area_id": "AREA-11", "area_name": "Data Integration & Interoperability", "kind": "Direct", "first_supported_level": 1, "rationale": "The L1 process descriptor explicitly includes targeted strategic integration initiatives. Integration planning and discovery directly support that early process capability; cross-organisation interoperability is not claimed.", "intermediate_practice": null, "earliest_level_evidence": {"descriptor_id": "D5-L1", "phrase": "strategic integration approach", "clause": "We see a strategic integration approach with the pursuit of Initiatives to implement FAIR principles within specific functions or groups. As part of these efforts, processes may surface for identifying internal and external good practices related to FAIR data. This approach may imply a move toward more systematic and structured approaches to FAIR implementation, aligning with the organization's evolving understanding of the importance of standardized and accessible data.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L120"}, "activity_ids": ["ACT-11-001", "ACT-11-002"], "activities": ["Plan & Analyze_Define data integration and lifecycle requirements", "Plan & Analyze_Perform Data Discovery"], "deliverables": ["DII Architecture; Data Exchange Specifications; Data Access Agreements", "DII Architecture; Data Exchange Specifications"], "source_references": ["file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1934", "file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1935"], "source_fair_direct": ["F2", "F4", "R1"], "source_fair_indirect": ["A1.2", "A2", "R1"], "status": "proposed documentary judgement; not an assessed maturity level"}, {"id": "ONSET-11-indirect", "area_id": "AREA-11", "area_name": "Data Integration & Interoperability", "kind": "Indirect", "first_supported_level": 1, "rationale": "Architecture and mappings enable implemented exchange and publication services. Data movement or canonical messages alone do not establish FAIR interoperability.", "intermediate_practice": "Develop and validate standardized data exchange and publication services", "earliest_level_evidence": {"descriptor_id": "D7-L1", "phrase": "Initial plans for tooling and infrastructure", "clause": "At this stage, there is an understanding of the data challenges and a recognition of the importance of FAIR data. Still, the organization needs to learn how to make it happen. Initial plans for tooling and infrastructure for POCs start to take shape, along with organizational buy-in.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L149"}, "activity_ids": ["ACT-11-006", "ACT-11-008"], "activities": ["Design DII Solutions_Design DII Architecture", "Design DII Solutions_Map Sources to Targets"], "deliverables": ["DII Architecture; Data Exchange Specifications; Data Access Agreements", "Data Exchange Specifications"], "source_references": ["file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1939", "file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L1941"], "source_fair_direct": ["R1.2"], "source_fair_indirect": ["A1", "A1.1", "A1.2", "A2", "I3"], "status": "proposed documentary judgement; not an assessed maturity level"}, {"id": "ONSET-13-direct", "area_id": "AREA-13", "area_name": "Big Data & Data Science", "kind": "Direct", "first_supported_level": 1, "rationale": "Big Data Strategy & Standards directly supports an emerging FAIR vision and plan only when FAIR objectives and acceptance criteria are explicitly commissioned. This is strategic onset, not deployed analytical capability.", "intermediate_practice": null, "earliest_level_evidence": {"descriptor_id": "D3-L1", "phrase": "A vision and plan for FAIR data begins to emerge", "clause": "Awareness of FAIR data started. A vision and plan for FAIR data begins to emerge. Different strategies are possible and are embryonic.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L85"}, "activity_ids": ["ACT-13-001"], "activities": ["Define Big Data Strategy & Business Needs"], "deliverables": ["Big Data Strategy & Standards"], "source_references": ["file:///D ling Ethics", "kind": "Direct", "first_supported_level": 1, "rationale": "An ethical data-handling strategy and communications plan can directly deliver early FAIR-specific process guidelines when they explicitly cover authorization and permitted reuse. Generic ethics policy alone is insufficient.", "intermediate_practice": null, "earliest_level_evidence": {"descriptor_id": "D5-L1", "phrase": "guidelines for creating FAIR data", "clause": "In recognizing FAIR data's potential (business) value, there are processes to consider and determine which data we should makeFAIR retrospectively. Efforts are underway to establish processes that provide guidelines for creating FAIR data, including the policy development for globally unique identifiers to enable the \"F\" principle.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L120"}, "activity_ids": ["ACT-14-003", "ACT-14-004"], "activities": ["Create an Ethical Data Handling Strategy", "Identify and Remediate Gaps in Existing Practices"], "deliverables": ["Ethical Data Handling Strategy; Ethical Corporate Statements on Data", "Current Practices and Gaps; Updated Policies"], "source_references": ["file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L2284", "file:///D:/Work-Documents/13_Research/2026_Research/FAIR/research-repos/FAIR-DAMA-FAIRMM/sources/2026-11-16/DAMA_Segments_High_Level_v1.18.0.md#L2285"], "source_fair_direct": [], "source_fair_indirect": ["A1.2", "R1.1"], "status": "proposed documentary judgement; not an assessed maturity level"}, {"id": "ONSET-14-indirect", "area_id": "AREA-14", "area_name": "Data Handling Ethics", "kind": "Indirect", "first_supported_level": 1, "rationale": "Ethical risk assessment and monitoring can commission controlled access and licensing; the policies do not establish the implemented resource properties.", " ta's potential (business) value, there are processes to consider and determine which data we should makeFAIR retrospectively. Efforts are underway to establish processes that provide guidelines for creating FAIR data, including the policy development for globally unique identifiers to enable the \"F\" principle.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L120"}, {"descriptor_id": "D3-L1", "phrase": "A vision and plan for FAIR data begins to emerge", "clause": "Awareness of FAIR data started. A vision and plan for FAIR data begins to emerge. Different strategies are possible and are embryonic.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L85"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-01", "level": 2, "descriptor_evidence": [{"descriptor_id": "D3-L2", "phrase": "vision, strategy and plan has approval", "clause": "The first version of the vision, strategy and plan has approval.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level2.md#L97"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-01", "level": 3, "descriptor_evidence": [{"descriptor_id": "D2-L3", "phrase": "budgets include a component for FAIR implementation", "clause": "Leadership (C level / or relevant department level) expectation is that any data project (or product) budgets include a component for FAIR implementation.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level3.md#L88"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-01", "level": 4, "descriptor_evidence": [{"descriptor_id": "D3-L4", "phrase": "integration of FAIR metrics into the data governance process", "clause": "The organization has set forth a comprehensive FAIR mandate across the enterprise. This mandate includes the integration of FAIR metrics into the data governance process and data risk management practices. The organization has allocated capacity (budget & people) to deliver on its FAIR data vision. The organization had the time to show the continuity of its strategy and can point to impact areas that have typically been there for several years.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level4.md#L109"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-01", "level": 5, "descriptor_evidence": [{"descriptor_id": "D3-L5", "phrase": "Metrics and methodologies to measure these outcomes", "clause": "Establishing Metrics and methodologies to measure these outcomes reinforces the strategy's connection to essential tools. Importantly, the organization comprehends the impact of FAIRness on its financial performance, prioritizing it as a part of its overarching business strategy, supported by empirical cost-benefit analyses.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level5.md#L103"}], "direct_active": true, "indirect_active": true, "interpretation": " cs/level1.md#L120"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-09", "level": 2, "descriptor_evidence": [{"descriptor_id": "D5-L2", "phrase": "licenses, refresh cycles, lineage", "clause": "The organization possesses comprehensive metadata and awareness of data specifics. Although not all data details are within a FAIR catalog, there's an insight into licenses, refresh cycles, lineage, rationale, intended usage, and business value. Process design ensures knowledge of these aspects, particularly in procurement, contributing to a more comprehensive understanding of data assets.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level2.md#L140"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-09", "level": 3, "descriptor_evidence": [{"descriptor_id": "D7-L3", "phrase": "metadata collection templates", "clause": "Tools that help create FAIR Data and manage metadata collection templates and ontologies are available.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level3.md#L186"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-09", "level": 4, "descriptor_evidence": [{"descriptor_id": "D1-L4", "phrase": "Enterprise-level Metadata standards are applied", "clause": "Data embeds Enterprise master and reference data. Enterprise-level Metadata standards are applied.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level4.md#L68"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-09", "level": 5, "descriptor_evidence": [{"descriptor_id": "D5-L5", "phrase": "Mechanisms exist to sustain metadata across organizations", "clause": "The organization actively shares its learnings internally and externally, among others, through communities of practices. Processes are in a position to align data harmonisation efforts beyond the organization, such as feedback loops with standard-setting bodies. Mechanisms exist to sustain metadata across organizations, including update and feedback processes between data vendors and consumers.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level5.md#L138"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-10", "level": 1, "descriptor_evidence": [{"descriptor_id": "D5-L1", "phrase": "data discovery, profiling, and optimization", "clause": "Data domains will have a data discovery, profiling, and optimization phase or project.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L120"}, {"descriptor_id": "D4-L1", "phrase": "curator", "clause": "Key emerging roles: curator (e.g. corrects and complements data in systems, checks consistency, completeness, and accuracy); semantic expert (e.g. creates and corrects data dictionaries)", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L101"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-10", "level": 2, "descriptor_evidence": [{"descriptor_id": "D5-L2", "phrase": "Regular retrospectives on pilot projects", "clause": "Regular retrospectives on pilot projects inform ongoing learning and improvements.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level2.md#L140"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-10", "level": 3, "descriptor_evidence": [{"descriptor_id": "D5-L3", "phrase": "evaluating and implementing FAIR standards", "clause": "The organization initiates formal training for FAIR roles while a majority have embraced FAIR principles for major resources, backed by well-trained personnel capable of evaluating and implementing FAIR standards. At least one business unit actively employs FAIR processes in production, supported by documentation and training, with other FAIR initiatives underway and coordinated efforts recognized.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level3.md#L158"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-10", "level": 4, "descriptor_evidence": [{"descriptor_id": "D6-L4", "phrase": "validating instance metadata against annotation requirements and data shapes", "clause": "Knowledge about validating instance metadata against annotation requirements and data shapes is evident.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level4.md#L170"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-10", "level": 5, "descriptor_evidence": [{"descriptor_id": "D7-L5", "phrase": "FAIR Data Validation", "clause": "**FAIR Data Validation**: Tools are in place to validate the FAIRness of data throughout its lifecycle.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level5.md#L173"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-11", "level": 1, "descriptor_evidence": [{"descriptor_id": "D5-L1", "phrase": "strategic integration approach", "clause": "We see a strategic integration approach with the pursuit of Initiatives to implement FAIR principles within specific functions or groups. As part of these efforts, processes may surface for identifying internal and external good practices related to FAIR data. This approach may imply a move toward more systematic and structured approaches to FAIR implementation, aligning with the organization's evolving understanding of the importance of standardized and accessible data.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L120"}, {"descriptor_id": "D7-L1", "phrase": "Initial plans for tooling and infrastructure", "clause": "At this stage, there is an understanding of the data challenges and a recognition of the importance of FAIR data. Still, the organization needs to learn how to make it happen. Initial plans for tooling and infrastructure for POCs start to take shape, along with organizational buy-in.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level1.md#L149"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-11", "level": 2, "descriptor_evidence": [{"descriptor_id": "D5-L2", "phrase": "integrated proof-of-concept projects", "clause": "Efforts toward aligning individual FAIR data processes are underway but still need to be standardized, with ongoing coordination and integrated proof-of-concept projects in development.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level2.md#L140"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-11", "level": 3, "descriptor_evidence": [{"descriptor_id": "D1-L3", "phrase": "integrated, processed and audited", "clause": "Data is “conformed” using a domain-level data model. It is integrated, processed and audited to support specific consumption patterns.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level3.md#L66"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-11", "level": 4, "descriptor_evidence": [{"descriptor_id" pported by documentation and training, with other FAIR initiatives underway and coordinated efforts recognized.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level3.md#L158"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-14", "level": 4, "descriptor_evidence": [{"descriptor_id": "D3-L4", "phrase": "integration of FAIR metrics into the data governance process", "clause": "The organization has set forth a comprehensive FAIR mandate across the enterprise. This mandate includes the integration of FAIR metrics into the data governance process and data risk management practices. The organization has allocated capacity (budget & people) to deliver on its FAIR data vision. The organization had the time to show the continuity of its strategy and can point to impact areas that have typically been there for several years.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level4.md#L109"}], "direct_active": true, "indirect_active": true, "interpretation": "Progression clauses describe increasingly demanding scope and practices. Carried association does not establish implementation of the full descriptor."}, {"area_id": "AREA-14", "level": 5, "descriptor_evidence": [{"descriptor_id": "D5-L5", "phrase": "planned processes to maintain FAIR implementation standards and tools", "clause": "There are planned processes to maintain FAIR implementation standards and tools (e.g., CV, ontologies) at the company and across data ecosystem partners.", "source": "https://github.com/Pistoia-Alliance-Inc/FAIR-Maturity-Matrix/blob/8ff4676eb340b0da5034ffb3d0e901c594c3cfc4/docs/level5.md#L138"}], "direct_active": true, "indirect_active": true, "interpretat for(const p of paths){p.addEventListener('pointerenter',()=>paint(p.dataset.link));p.addEventListener('pointerleave',()=>paint());p.addEventListener('focus',()=>paint(p.dataset.link));p.addEventListener('blur',()=>paint());p.addEventListener('click',()=>select(p.dataset.link));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.dataset.link)}})}
for(const e of document.querySelectorAll('[data-node]')){e.addEventListener('pointerenter',()=>paint(e.dataset.node));e.addEventListener('pointerleave',()=>paint());if(e.tagName.toLowerCase()==='text'){const node=model.nodes.find(n=>n.id===e.dataset.node),a=document.createElementNS('http://www.w3.org/2000/svg','a');a.setAttribute('href',node.documentation_url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');a.setAttribute('aria-label','Open documentation: '+node.label);e.replaceWith(a);a.append(e);a.addEventListener('focus',()=>paint(node.id));a.addEventListener('blur',()=>paint());}}
})();
</script></body></html>
