<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAMA and FAIRMM offline Sankey</title>
<style>body{font:16px/1.55 system-ui,sans-serif;margin:24px;color:#16283c;background:#fff}main{max-width:1800px;margin:auto}.chart{overflow-x:auto}svg{display:block;min-width:900px;width:100%;height:auto}.ribbons path,[data-node]{cursor:pointer}.ribbons path:focus{outline:2px solid #16283c}.detail{border-top:1px solid #cbd5e1;margin-top:16px;padding-top:16px}a{color:#2463a7}h2{font-size:20px}li{margin:5px 0}</style></head>
<body><main><p>Hover or focus on nodes to highlight connections. Select a ribbon for rationale and deliverables; select a label to open documentation.</p><div class="chart">__SVG__</div><section class="detail" aria-live="polite"><h2 id="selected-title">Select a relationship</h2><div id="selected-details">Rationale and deliverables appear here.</div></section></main>
<script>
(() => {
const model=__MODEL__,paths=[...document.querySelectorAll('[data-link]')];
function paint(id){for(const p of paths){const link=model.links.find(l=>l.id===p.dataset.link);p.style.fillOpacity=id?(link.id===id||link.source===id||link.target===id?'.85':'.06'):'.35'}}
function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
function list(parent,values){const ul=document.createElement('ul');parent.append(ul);for(const value of values)text(ul,'li',value)}
function select(id){const link=model.links.find(l=>l.id===id);const detail=document.getElementById('selected-details');detail.replaceChildren();document.getElementById('selected-title').textContent=link.source_label+' → '+link.target_label+' · '+link.kind;text(detail,'h3','Rationale');list(detail,link.rationales);text(detail,'h3','Deliverables');list(detail,link.deliverables);text(detail,'h3','Applicability conditions');list(detail,link.conditions);text(detail,'p','Source FAIR IDs: '+(link.principles.join(', ')||'None assigned')+'. Original contribution types: '+(link.original_fair_contribution_types.join(', ')||'None assigned')+'.');}
for(const p of paths){p.addEventListener('pointerenter',()=>paint(p.dataset.link));p.addEventListener('pointerleave',()=>paint());p.addEventListener('focus',()=>paint(p.dataset.link));p.addEventListener('blur',()=>paint());p.addEventListener('click',()=>select(p.dataset.link));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.dataset.link)}})}
for(const e of document.querySelectorAll('[data-node]')){e.addEventListener('pointerenter',()=>paint(e.dataset.node));e.addEventListener('pointerleave',()=>paint());if(e.tagName.toLowerCase()==='text'){const node=model.nodes.find(n=>n.id===e.dataset.node),a=document.createElementNS('http://www.w3.org/2000/svg','a');a.setAttribute('href',node.documentation_url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');a.setAttribute('aria-label','Open documentation: '+node.label);e.replaceWith(a);a.append(e);a.addEventListener('focus',()=>paint(node.id));a.addEventListener('blur',()=>paint());}}
})();
</script></body></html>
