name: Validate integrated ontology component

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: integrated
    env:
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.9'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: zulu
          java-version: '17.0.21.1'
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify host source pins
        run: python scripts/verify_host_sources.py
      - name: Build validate document and package
        run: python scripts/pipeline.py
      - name: Retain review artefacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: FAIR-DAMA-Integrated-repository-review
          path: integrated/release/
          if-no-files-found: error
          retention-days: 14
